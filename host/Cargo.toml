[package]
name = "espnow-harness"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
humantime-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
